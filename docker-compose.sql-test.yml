# Standalone, disposable topology. Never combine with the application Compose file.
name: reza-sql-tests
services:
  sql-test:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${REZA_SQL_TEST_PASSWORD:?Set a disposable test password}
    ports:
      - '127.0.0.1:11434:1433'
    # No application network, persistent volume or production env_file.
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  tests:
    build: ./backend
    entrypoint: ['python', 'manage.py']
    command: ['test', '--noinput', '--settings=reza_backend.sql_test_settings', '--verbosity=2']
    environment:
      REZA_SQL_TEST: disposable
      REZA_SQL_TEST_HOST: sql-test
      REZA_SQL_TEST_PASSWORD: ${REZA_SQL_TEST_PASSWORD:?Set a disposable test password}
    depends_on:
      sql-test:
        condition: service_healthy
