services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: reza-formal-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}"
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: reza-formal-backend
    depends_on:
      - db
    environment:
      DEBUG: "${DJANGO_DEBUG:-True}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in the root .env file}"
      DJANGO_SUPERUSER_EMAIL: "${DJANGO_SUPERUSER_EMAIL:-}"
      DJANGO_SUPERUSER_PASSWORD: "${DJANGO_SUPERUSER_PASSWORD:-}"
      DJANGO_SUPERUSER_USERNAME: "${DJANGO_SUPERUSER_USERNAME:-admin}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000}"
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-False}"
      AUTH_COOKIE_SAMESITE: "${AUTH_COOKIE_SAMESITE:-Lax}"
      AUTH_REFRESH_COOKIE_SAMESITE: "${AUTH_REFRESH_COOKIE_SAMESITE:-Strict}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-False}"
      CSRF_COOKIE_SECURE: "${CSRF_COOKIE_SECURE:-False}"
      SECURE_SSL_REDIRECT: "${SECURE_SSL_REDIRECT:-False}"
      SECURE_HSTS_SECONDS: "${SECURE_HSTS_SECONDS:-0}"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}"
      SECURE_HSTS_PRELOAD: "${SECURE_HSTS_PRELOAD:-False}"
      TRUST_X_FORWARDED_PROTO: "${TRUST_X_FORWARDED_PROTO:-False}"
      DB_AUTO_CREATE: "${DB_AUTO_CREATE:-true}"
      DB_NAME: "${DB_NAME:-reza}"
      DB_USER: "${DB_USER:-sa}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-1433}"
      DB_DRIVER: "${DB_DRIVER:-ODBC Driver 18 for SQL Server}"
      DB_ENCRYPT: "${DB_ENCRYPT:-no}"
      DB_TRUST_SERVER_CERTIFICATE: "${DB_TRUST_SERVER_CERTIFICATE:-yes}"
      DB_CONNECTION_TIMEOUT: "${DB_CONNECTION_TIMEOUT:-30}"
      DB_WAIT_TIMEOUT: "${DB_WAIT_TIMEOUT:-180}"
      MEDIA_URL: "/media/"
      MEDIA_ROOT: "/app/media"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      RUN_COLLECTSTATIC: "${RUN_COLLECTSTATIC:-true}"
      RUN_SEED_DATA: "${RUN_SEED_DATA:-true}"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - django_media:/app/media
      - django_static:/app/staticfiles
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: "${VITE_API_BASE:-/api}"
    container_name: reza-formal-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  mssql_data:
  django_media:
  django_static:
