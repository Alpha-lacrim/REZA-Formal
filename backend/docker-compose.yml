version: '3.8'
services:
  db:
    image: mysql:8.0
    env_file:
      - ./.env
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    command: bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    environment:
      # Environment loaded from .env in this folder (do not commit secrets)
    env_file:
      - ./.env
    depends_on:
      - db

volumes:
  db_data:
