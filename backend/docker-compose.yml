# version: '3.8'

services:
  web:
    build: .
    command: bash -c "/app/wait_for_db.sh && python manage.py makemigrations --noinput && python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    # Note: SQL Server connection is configured via .env variables (DB_HOST, DB_USER, etc.)
    # Ensure your SQL Server instance is running and accessible at the DB_HOST address