version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: reza
      MYSQL_USER: reza
      MYSQL_PASSWORD: reza
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    command: bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql://reza:reza@db:3306/reza
      DJANGO_SECRET_KEY: change-me
      DEBUG: 'True'
    depends_on:
      - db

volumes:
  db_data:
