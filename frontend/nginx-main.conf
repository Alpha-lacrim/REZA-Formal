worker_processes auto;
pid /tmp/nginx.pid;
# Nginx error diagnostics can include raw URLs; normal failures use safe access
# events below. Restrict critical stderr diagnostics to operational responders.
error_log /dev/stderr crit;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # URI patterns deliberately avoid path IDs, queries, IPs and user agents.
    map $uri $log_route {
        default frontend;
        ~^/api/ api;
        ~^/media/ media;
        ~^/static/ static;
        ~^/assets/ assets;
    }
    log_format operations escape=json
        '{"timestamp":"$time_iso8601","level":"INFO","logger":"nginx.access",'
        '"event":"request_completed","request_id":"$request_id",'
        '"method":"$request_method","route":"$log_route","status":$status,'
        '"duration_seconds":$request_time,"upstream_status":"$upstream_status"}';
    map "$uri:$status" $log_request {
        default 1;
        ~^/api/health/(live|ready)/:200$ 0;
        ~^/healthz:200$ 0;
    }
    access_log /dev/stdout operations if=$log_request;
    include /etc/nginx/conf.d/*.conf;
}
