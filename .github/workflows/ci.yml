name: CI

on:
  push:
    branches: [main, dev, 'feature/**', 'codex/**']
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.17'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes unixodbc-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
          python -m pip check
          python ../scripts/check-build-inputs.py
      - name: Django checks
        run: |
          python manage.py check --settings=reza_backend.test_settings
          python manage.py makemigrations --check --dry-run --settings=reza_backend.test_settings
      - name: Backend tests
        run: python manage.py test --settings=reza_backend.test_settings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose topology
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-runtime-secret
          DB_PASSWORD: CiOnly-SqlPassword-493!
        run: |
          docker compose config --quiet
          REZA_SQL_TEST_PASSWORD='CiOnly-SqlPassword-493!' docker compose -f docker-compose.sql-test.yml config --quiet
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.17'
      - run: python scripts/validate-production-config.py

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Build locked runtime images locally
        run: |
          docker build -t reza-b10-backend:local backend
          docker build -t reza-b10-frontend:local frontend
      - name: Proxy regression gate
        run: node scripts/test-nginx-security.mjs
      - name: Isolated startup, shutdown, persistence and recovery drill
        run: node scripts/test-production-runtime.mjs
      - name: Install checksum-verified image scanner
        run: |
          curl --fail --location --retry 3 https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy.tar.gz"
          echo 'c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  '"$RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
      - name: Gate fixable high/critical runtime image vulnerabilities
        run: |
          "$RUNNER_TEMP/trivy" image --timeout 15m --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 reza-b10-backend:local
          "$RUNNER_TEMP/trivy" image --timeout 15m --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 reza-b10-frontend:local
      # Deliberately no login, image push, remote environment or deployment job.
