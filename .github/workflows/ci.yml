name: CI

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes unixodbc-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Django checks
        run: |
          python manage.py check --settings=reza_backend.test_settings
          python manage.py makemigrations --check --dry-run --settings=reza_backend.test_settings
      - name: Backend tests
        run: python manage.py test --settings=reza_backend.test_settings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose topology
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-runtime-secret
          DB_PASSWORD: CiOnly-SqlPassword-493!
        run: docker compose config --quiet
