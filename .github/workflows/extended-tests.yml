name: Extended integration tests

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Expensive isolated lane
        type: choice
        options: [e2e, sql, all]
        default: e2e

permissions:
  contents: read
concurrency:
  group: extended-${{ github.ref }}-${{ inputs.lane }}
  cancel-in-progress: true

jobs:
  e2e:
    if: inputs.lane == 'e2e' || inputs.lane == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.17'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          pip install --require-hashes --only-binary=:all: -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
  sql:
    if: inputs.lane == 'sql' || inputs.lane == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REZA_SQL_TEST_PASSWORD: Disposable-CI-only-493!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Migrate a fresh test database and run the complete suite on SQL Server
        run: docker compose -f docker-compose.sql-test.yml up --build --abort-on-container-exit --exit-code-from tests
      - name: Remove only the disposable lane containers
        if: always()
        run: docker compose -f docker-compose.sql-test.yml down
