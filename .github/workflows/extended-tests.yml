name: Extended integration tests

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Expensive isolated lane
        type: choice
        options: [e2e, sql, all]
        default: e2e

permissions:
  contents: read
concurrency:
  group: extended-${{ github.ref }}-${{ inputs.lane }}
  cancel-in-progress: true

jobs:
  e2e:
    if: inputs.lane == 'e2e' || inputs.lane == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
  sql:
    if: inputs.lane == 'sql' || inputs.lane == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REZA_SQL_TEST_PASSWORD: Disposable-CI-only-493!
    steps:
      - uses: actions/checkout@v4
      - name: Migrate a fresh test database and run the complete suite on SQL Server
        run: docker compose -f docker-compose.sql-test.yml up --build --abort-on-container-exit --exit-code-from tests
      - name: Remove only the disposable lane containers
        if: always()
        run: docker compose -f docker-compose.sql-test.yml down
